<svg width="680" height="340" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg"><title>SD module to SP/CE plug</title><desc>Six wires from the eight-position SP/CE socket on the back of the Display Pack 2.8 to the six pins of a 3.3 volt microSD module. Positions 2 and 8 of the plug stay empty.</desc><rect x="0" y="0" width="680" height="340" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect fill="#FFFFFF" stroke="#B4B2A9" x="40" y="60" width="150" height="250" rx="8" stroke-width="0.5"/><text fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" x="115" y="78" text-anchor="middle" dominant-baseline="central">SP/CE socket</text><text fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif" font-size="12" x="115" y="94" text-anchor="middle" dominant-baseline="central">Display Pack, back</text><g fill="#E1F5EE" stroke="#0F6E56"><rect x="52" y="110" width="126" height="16" rx="3" stroke-width="0.5"/><text fill="#085041" stroke="none" font-family="Helvetica, Arial, sans-serif" font-size="12" x="58" y="118" dominant-baseline="central">1 · GND</text></g><g fill="#F1EFE8" stroke="#5F5E5A"><rect x="52" y="134" width="126" height="16" rx="3" stroke-width="0.5"/><text fill="#444441" stroke="none" font-family="Helvetica, Arial, sans-serif" font-size="12" x="58" y="142" dominant-baseline="central">2 · GP7, empty</text></g><g fill="#E1F5EE" stroke="#0F6E56"><rect x="52" y="158" width="126" height="16" rx="3" stroke-width="0.5"/><text fill="#085041" stroke="none" font-family="Helvetica, Arial, sans-serif" font-size="12" x="58" y="166" dominant-baseline="central">3 · GP8 MISO</text></g><g fill="#E1F5EE" stroke="#0F6E56"><rect x="52" y="182" width="126" height="16" rx="3" stroke-width="0.5"/><t