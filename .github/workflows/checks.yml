name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check HTTP, Wi-Fi, emulation, and browser guide
        run: |
          python3 tools/check-net-http.py
          python3 tools/check-netcard.py
          python3 tools/check-wifi-config.py
          python3 tools/check-wifi-dhcp.py
          python3 tools/check-wifi-access-point.py
          python3 tools/check-configure-wifi.py
          python3 tools/check-ssh-terminal.py
          python3 tools/check-ssh-control.py
          python3 tools/check-ssh-identity.py
          python3 tools/check-smartport-storage.py
          python3 tools/check-video-mixed.py
          python3 tools/check-cpu-bus.py
          node tools/check-guide.mjs
          python3 tools/check-disk-library.py
          python3 tools/check-web-upload.py
          python3 tools/check-clean-package.py
          python3 tools/check-board-memory.py
          python3 tools/check-tufty-power.py
          python3 tools/check-dos-catalog.py
          python3 tools/check-launcher.py

  ssh-interoperability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch the pinned SDK cryptography and TCP buffer sources
        run: |
          git clone --branch 2.2.0 --depth 1 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          test "$(git -C "$RUNNER_TEMP/pico-sdk" rev-parse HEAD)" = a1438dff1d38bd9c65dbd693f0e5db4b9ae91779
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/mbedtls lib/lwip
      - name: Test the embedded engine with stock OpenSSH and sanitizers
        run: python3 tests/test_ssh_transport.py --sdk "$RUNNER_TEMP/pico-sdk"

  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico, tufty]
        usb: [console, keyboard]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Fetch Pico SDK 2.2.0
        run: |
          git clone --branch 2.2.0 --depth 1 --recurse-submodules https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          test "$(git -C "$RUNNER_TEMP/pico-sdk" rev-parse HEAD)" = a1438dff1d38bd9c65dbd693f0e5db4b9ae91779
          echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"
      - name: Build firmware
        run: python3 tools/build-public-firmware.py --board ${{ matrix.board }} --usb ${{ matrix.usb }} --jobs 4
      - name: Check USB keyboard input against the pinned TinyUSB headers
        if: matrix.usb == 'keyboard'
        run: python3 tools/check-usb-input.py
